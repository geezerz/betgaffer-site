<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="Bet Gaffer">
  <!-- The BG monogram: icon contexts only (favicon, home-screen tile, social avatar). Anywhere a
       person reads the interface uses the HTML wordmark. Radius 26/112 = 23.2% of the side. -->
  <rect width="112" height="112" rx="26" fill="#131C27"/>
  <text x="56" y="78" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="-1"><tspan fill="#FFFFFF">B</tspan><tspan fill="#22C55E">G</tspan></text>
</svg>
